name: Build and publish Playroom APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check && npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle -p android assembleDebug
      - name: Publish installable APK in GitHub Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=$(find android/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$APK"
          cp "$APK" AAC-Playroom-v2.0.0-debug.apk
          if gh release view v2.0.0 >/dev/null 2>&1; then
            gh release upload v2.0.0 AAC-Playroom-v2.0.0-debug.apk --clobber
          else
            gh release create v2.0.0 AAC-Playroom-v2.0.0-debug.apk \
              --target "$GITHUB_SHA" \
              --title "AAC Playroom v2.0.0 — 16 games" \
              --notes "Offline Android testing APK with 16 games. Debug-signed test build; no Bluetooth phone-to-phone gameplay yet." \
              --prerelease
          fi
