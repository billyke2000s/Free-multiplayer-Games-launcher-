name: Build and publish Playroom APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check && npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle -p android assembleDebug
      - name: Verify universal APK contains no architecture-specific native libraries
        run: |
          set -euo pipefail
          APK=$(find android/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$APK"
          if unzip -Z1 "$APK" | grep -E '^lib/[^/]+/.*[.]so$'; then
            echo "::error::APK now contains native libraries. Review ABIs before calling it universal."
            exit 1
          fi
          echo "Universal Java/WebView APK: no native ABI restrictions."
      - name: Publish versioned universal APK in GitHub Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" android/app/build.gradle | head -1)
          test -n "$VERSION"
          TAG="v$VERSION"
          APK=$(find android/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$APK"
          FILE="AAC-Playroom-${TAG}-universal-debug.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to re-upload the same version."
            exit 0
          fi
          cp "$APK" "$FILE"
          gh release create "$TAG" "$FILE" \
            --target "$GITHUB_SHA" \
            --title "AAC Playroom $TAG — universal Android APK" \
            --notes "Offline Android testing build supporting ARM32, ARM64, x86 and x86-64 from one universal APK (no native libraries). Includes updated 8-ball pool controls and Space Explorer joystick/four-edge asteroids. Debug-signed pre-release; physical-device testing and Bluetooth multiplayer are not complete." \
            --prerelease
